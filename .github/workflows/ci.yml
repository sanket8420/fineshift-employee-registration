name: Workflow for employee registration project demo

on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  build_artifact:
    runs-on: self-hosted 

    steps:
      - name: checkout source code 
        uses: actions/checkout@v4
      - name: setting up java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build Maven Application
        run: |
          echo "======================================"
          echo "BUILDING MAVEN APPLICATION"
          echo "======================================"

          mvn clean package

          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"

  Upload-artifact:
    runs-on: self-hosted
    needs: build_artifact
    
    steps:
        
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
         name: maven-war-${{ github.sha }}
         path: target/*.war
         retention-days: 1
  

  test:
    runs-on: self-hosted
    needs: build_artifact

    steps:
      - name: testing 
        run: mvn test

  deployment:
    runs-on: self-hosted
    needs: test
    
    steps:
      - name: deploying 
        run: | 
          echo "WAR file:"
          ls -lh target/*.war

          echo "Copying WAR to Tomcat..."
          sudo cp target/*.war /var/lib/tomcat10/webapps/



